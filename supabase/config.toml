# Config del proyecto para la CLI de Supabase. Solo lo que hace falta para
# desplegar las Edge Functions; el resto usa los defaults.
project_id = "yvhigwgqmckuxzuxtovq"

# El runtime verifica el JWT solo con HS256 (legacy). Este proyecto firma con
# ES256, asi que cada funcion verifica la sesion por su cuenta (_shared/auth.mjs)
# y las publicas (webhook, workers) autentican por firma o por secreto.
[functions.api]
verify_jwt = false

[functions.worker-poll]
verify_jwt = false

[functions.worker-send]
verify_jwt = false

[functions.meta-webhook]
verify_jwt = false
